<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="Form.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>Form</title>
  </head>
  <body>
    <div class="container">
        <div class="cards">
            <h1>Contact Form</h1>
            <label for="name">Full Name: </label>
            <input type="text" name="" id="name" placeholder="Enter your full name">
            <label for="compname">Company Name: </label>
            <input type="text" name="" id="compname" placeholder="Enter your company name">
            <label for="email">Email: </label>
            <input type="email" name="" id="email" placeholder="Enter your email">
            <label for="message">Message: </label>
            <textarea name="" id="message" cols="30" rows="10" placeholder="Enter your message"></textarea>
            <button id="submitbtn">Submit</button>
        </div>
    </div>
    <script src="Portfolio.js"></script>
  </body>
</html>
